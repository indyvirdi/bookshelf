# On every push: find covers and details for new books, rebuild books.json, then publish to GitHub Pages.
name: Update shelf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shelf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Find covers and details for new books
        run: node scripts/enrich.mjs

      - name: Build books.json
        run: node scripts/build.mjs

      - name: Save the new covers and details back to the repo
        run: |
          git config user.name "shelf-bot"
          git config user.email "shelf-bot@users.noreply.github.com"
          git add books covers data
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Add covers and details [skip ci]"
            git push
          fi

      - name: Collect the site files
        run: mkdir _site && cp -r index.html assets data covers _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
